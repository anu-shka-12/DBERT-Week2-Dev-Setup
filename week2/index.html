<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sales Analytics Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Sales Analytics Dashboard</h1>
        <p>DBERT Week 2 - Dev Setup Project</p>
    </header>

    <main>

        <section class="cards">

            <div class="card">
                <h3>Total Sales</h3>
                <p id="totalSales">₹0</p>
            </div>

            <div class="card">
                <h3>Total Orders</h3>
                <p id="totalOrders">0</p>
            </div>

            <div class="card">
                <h3>Total Customers</h3>
                <p id="totalCustomers">0</p>
            </div>

        </section>

        <section class="table-section">

            <h2>Sales Data</h2>

            <table>

                <thead>
                    <tr>
                        <th>Customer</th>
                        <th>Product</th>
                        <th>Amount</th>
                    </tr>
                </thead>

                <tbody id="salesTable">
                </tbody>

            </table>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
